spring.application.name=unimart-backend

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/unimart
spring.datasource.username=unimart_app
spring.datasource.password=200419
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
